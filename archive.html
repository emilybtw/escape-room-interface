<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Space Archive Terminal // 2070</title>
    <style>
        body, html {
            background-color: #02060e;
            color: #00f0ff;
            font-family: 'Orbitron', 'Courier New', Courier, monospace;
            padding: 40px;
            margin: 0;
            overflow-x: hidden;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%)
                        linear-gradient(90deg, rgba(0, 240, 255, 0.03), rgba(0, 255, 20, 0.02), rgba(0, 0, 255, 0.04));
            z-index: 999;
            background-size: 100% 3px, 4px 100%;
            pointer-events: none;
            animation: holoGlow 6s infinite linear;
        }

        .terminal-container {
            border: 2px solid rgba(0, 240, 255, 0.2);
            background: rgba(4, 14, 28, 0.6);
            backdrop-filter:  blur(10px);
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.1), inset 0 0 30px rgba(0, 240, 255, 0.05);
            border-radius: 8px;
            position: relative;
        }

        .terminal-container::before {
            content: ""; position: absolute; top: -2px; left: -2px; width: 25px; height: 25px;
            border-top: 4px solid #00f0ff; border-left: 4px solid #00f0ff; filter: drop-shadow(0 0 8px #00f0ff);
        }

        .terminal-container::after {
            content: ""; position: absolute; bottom: -2px; right: -2px; width: 25px; height: 25px;
            border-bottom: 4px solid #00f0ff; border-right: 4px solid #00f0ff; filter: drop-shadow(0 0 8px #00f0ff);
        }

        .terminal-header {
            border-bottom: 1px dashed rgba(0, 240, 255, 0.4);
            padding-bottom: 20px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 2rem;
            font-family: 'Impact', sans-serif;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            text-transform: uppercase;
        }

        .system-specs {
            text-align: right;
            font-size: 0.8rem;
            color: #00ff99;
            text-shadow: 0 0 5px rgba(0, 255, 153, 0.4);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
        }

        .file-card {
            background-color: rgba(0, 40, 60, 0.25);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px;
            padding: 30px;
            text-align: center;
            cursor: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .file-card:hover {
            border-color: #00f0ff;
            background: rgba(0, 40, 60, 0.45);
            box-shadow: 0 0 25pc rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.3);
            transform: translateY(-5px) scale(1.02);
        }

        .file-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(transparent 50%, rgba(0, 240, 255, 0.1) 50%);
            background-size: 100% 4px; opacity: 0; transition: opacity 0.3s;
        }

        .file-card:hover::before { opacity: 1; }

        .file-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: block;
            filter: drop-shadow(0 0 8px rgba (0, 240, 255, 0.6));
            transition: transform 0.3s;
        }

        .file-card:hover .file-icon {
            transform: rotate(5deg) scale(1.1);
        }

        .file-name {
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .file-card.corrupted {
            border-color: rgba(255, 0, 85, 0.4);
            box-shadow: inset 0 0 15px rgba(255, 0, 84, 0.15);
        }

        .file-card.corrupted .file-icon { filter: drop-shadow(0 0 8px rgba(255, 0, 85, 0.5)); }

        .file-card.corrupted:hover .file-name {
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.8);
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(3, 12, 26, 0.95);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.4), inset 0 0 30px rgba(0, 240, 255, 0.2);
            padding: 40px;
            border-radius: 6px;
            z-index: 10;
            width: 60%;
            animation: modalSlide 0.3s cubic-bexier(0.19, 1, 0.22, 1);
        }

        .modal h2 {
            font-family: 'Impact', sans-serif;
            letter-spacing: 3px;
            margin-top: 0;
            text-shadow: 0 0 10px #00f0ff;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(1, 4, 10, 0.9);
            backdrop-filter: blue(8px);
            z-index: 9;
        }

        .close-btn {
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 12px 24px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 25px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .close-btn:hover {
            background: #00f0ff;
            color: #02060e;
            box-shadow: 0 0 20px #00f0ff;
        }

        @keyframes holoGlow {
            0%, 100% {opacity: 0.98; }
            50% {opacity: 1; }
        }

        @keyframes modalSlide {
            from {transform: translate(-50%, -45%); opacity: 0; }
            to { transform: translate(-50%, -50%); opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="terminal-container">
        <div class="termina;-header">
            <div>
                <h1>🛰️ Quantum Databank // Orbit-Node_04</h1>
                <p style="margin: 5px 0 0 0; color: #00ff99; font-size: 0.9rem; letter-spacing: 1px;">
                    ● ENCRYPTION LAYER: ACTIVE // SECURE DATASTREAM STABLE
                </p>
            </div>
            <div class="system-specs">
                SYS.LOC: ORBITAL_SECTOR_4<br>
                DATE: 11.10.2027 // 14:02<br>
                GRAVITY: 0.38G // MARS_SYNC
            </div>
        </div>

        <div class="file-grid">
            <div class="file-card" onclick="openFile('//SECURE LOG: QUARENTINE_BREACH', 'WARNING: Bio-containment assets broke terminal isolation parameters at 0400 hours. Airborne quarentine vectors confirmed traveling into primary ventilation matrices. Fallback life support structural loops failed completely.')">
                <span class="file-icon">⚡</span>
                <div class="file-name">quarentine_breach.log</div>
            </div>

            <div class="file-card" onclick="openFile('// STRUCTURAL GRID: SECTOR_4', 'MAINTENANCE ADVISORY: Main structural tunnels sitting beneath life support nodes retain a localized manual mechanical override bypass panel. Accessing this array avoids secondary main server detection protocols.')">
                <span class="file-icon">📡</span>
                <div class="file-name">sector_4_schematics.dat</div>
            </div>

            <div class="file-card corrupted" onclick="triggerSystemTrap()">
                <span class="file-icon">🔥</span>
                <div class="file-name">CORE_OVERRIDE_BYPASS.bin</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal" id="fileModal">
        <h2 id="modalTitle"></h2>


    <script>
        const socket = new WebSocket('ws://127.0.0.1:8080');

        function openFile(title, text) {
            document,getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = text;
            document.getElementById('fileModal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('fileModal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function triggerSystemTrap() {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send('TRIGGER_PENALTY');
            }
        }
    </script>
