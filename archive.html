<!DOCTYPE html>
<html land="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Space Archive Terminal // 2070</title>
    <style>
        body, html {
            background-color: #02060e;
            color: #00f0ff;
            font-family: 'Orbitron', 'Courier New', Courier, monospace;
            padding: 40px;
            margin: 0;
            overflow-x: hidden;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
                        linear-gradient(90deg, rgba(0, 240, 255, 0.03), rgba(0, 255, 150, 0.01), rgba(0, 0, 255, 0.04));
            z-index: 999;
            background-size: 100%, 3px, 4px, 100%;
            pointer-events: none;
        }

        .terminal-container {
            border: 2px solid rgba(0, 240, 255, 0.2);
            background: rgba(4, 14, 28, 0.95);
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.1), inset 0 0 30px rgba(0, 240, 255, 0.05);
            border-radius: 8px;
            position: relative;
        }

        .terminal-container::before {
            content: ""; position: absolute; top: -2px; left: -2px; width: 25px; height: 25px;
            border-top: 4px solid #00f0ff; border-left: 4px solid #00f0ff; filter: drop-shadow(0 0 8px #00f0ff);
        }

        .terminal-container::after {
            content: ""; position: absolute; bottom: -2px; right: -2px; width: 25px; height: 25px;
            border-bottom: 4px solid #00f0ff; border-right: 4px solid #00f0ff; filter: drop-shadow(0 0 8px #00f0ff);
        }

        .terminal-header {
            border-bottom: 1px dashed rgba(0, 240, 255, 0.4);
            padding-bottom: 25px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 2rem;
            font-family: 'Impact', sans-serif;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .system-specs {
            text-align: right;
            font-size: 0.8rem;
            color: #00ff99;
            text-shadow: 0 0 5px rgba(0, 255, 153, 0.4);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
        }

        .file-grid .file-card, .file-grid .input-card {
            background: rgba(0, 40, 60, 0.25) !important;
            border: 1px solid rgba(0, 240, 255, 0.3) !important;
            border-radius: 4px !important;
            padding: 30px !important;
            text-align: center !important;
            position: relative !important;
            box-shadow: inset 0 0 15px rgba(0, 250, 255, 0.1) !important;
        }

        .file-grid .file-card { cursor: pointer; }

        .file-grid .file-icon, .file-grid .input-icon {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin: 0 auto 15px auto;
            display: block;
        }

        .file-name {
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
            margin-bottom: 15px;
        }

        .input-title {
            color: #00ff99;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0,255,153,0.3);
            margin-bottom: 15px;
        }

        .cyber-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00f0ff;
            color: #ffffff;
            font-family: monospace;
            font-size: 1.1rem;
            padding: 8px;
            width: 80%;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            margin-bottom: 15px;
            box-shadow: inset 0 0 5px rgba(0, 240, 255, 0.2);
        }

        .cyber-input:focus {
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            border-color: #ffffff;
        }

        .cyber-btn {
            background: rgba(0, 255, 153, 0.15);
            color: #00ff99;
            border: 1px solid #00ff99;
            padding: 8px 20px;
            font-family: monospace;
            cursor: pointer;
            font-weight: bold;
            width: 88%;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .cyber-btn:hover {
            background: #00ff99;
            color: #02060e;
            box-shadow: 0 0 15px #00ff99;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(3, 12, 26, 0.98);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 50pd rgba(0, 240, 255, 0.4), inset 0 0 30px rgba(0, 240, 255, 0.2);
            padding: 40px; 
            border-radius: 6px;
            z-index: 10;
            width: 60%;
        }

        .modal h2 { font-family: 'Impact', sans-serif; letter-spacing: 3px; margin-top: 0; text-shadow: 0 0 10px #00f0ff; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(1, 4, 10, 0.95);
            z-index: 9;
        }

        .close-btn {
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 12px 24px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 25px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .close-btn:hover { background: #00f0ff; color: #02060e; box-shadow: 0 0 20px #00f0ff; }

        .file-grid .file-card {
            transition: border-color 0.2s, box-shadow 0.2s !important;
        }

        .file-grid .file-card:hover {
            transform: none !important;
            border-color: #00f0ff !important;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.3) !important;
        }

        .file-grid .file-icon {
            transition: transform 0.2s cubic-bezier(0.19, 1, 0.22, 1) !important;
        }

        .file-grid .file-card:hover .file-icon {
            transform: translateY(-6px) scale(1.05) !important;
        }
    </style>
</head>

<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div>
                <h1>Quantum Databank // Node_04</h1>
                <p style="margin: 5px 0 0 0; color: #00ff99; font-size: 0.9rem; letter-spacing: 1px;">
                    DATA ARCHIVE COMPILING STABLE // VER 20.70
                </p>
            </div>
            <div class="system-specs">
                SYS.LOC: ORBITAL_SECTOR_4<br>
                DATE: 11.10.2070 // 14:02<br>
                GRAVITY: 0.38G // MARS_SYNC
            </div>
        </div>

        <div class="file-grid">
            <div class="file-card" onclick="openFile('// SECURE LOG: QUARANTINE_BREACH', 'WARNING: Bio-containment assets broke isolation parameters at 0400 hours. Quarantine vectors confirmed traveling into ventilation grids.')">
                <img src="File-Icon.png" class="file-icon" alt="File Asset">
                <div class="file-name">???</div>
            </div>

            <div class="file-card" onclick="openFile('// GRID STRUCTURAL: DATA', 'MAINTENANCE ADVISORY: Main mechanical ventilation shafts are running secondary code parameters.')">
                <img src="File-Icon.png" class="file-icon" alt="File Asset">
                <div class="file-name">???</div>
            </div>

            <div class="file-card" onclick="triggerSystemTrap()">
                <img src="File-Icon.png" class="file-icon" alt="File Asset">
                <div class="file-name">???</div>
            </div>

            <div class="input-card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;">
                <img src="File-Icon.png" class="input-icon" alt="Console Asset" style="margin: 0; filter: drop-shadow(0 0 5px rgba(0,255,153,0.5));">
                <div style="color: #00ff99; font-weight: bold; font-size: 1rem; letter-spacing: 2px; text-shadow: 0 0 5px rgba(0,255,153,0.3);">BYPASS TERMINAL</div>
                
                <input type="text" id="overrideCode" class="cyber-input" placeholder="CODE..." maxlength="8" style="width: 80% !important; display: block !important; box-sizing: border-box;">

                <button class="cyber-btn" id="submitCode" style="width: 80% !important; display: block !important;">EXECUTE KEY</button>
            </div>
        </div>
    </body>

<script>
    const socket = new WebSocket('ws://127.0.0.1:8080');

    function openFile(title, text) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerText = text;
        document.getElementById('fileModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('fileModal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function triggerSystemTrap() {
        socket.send('TRIGGER_PENALTY');
        console.log("Trap fired over the network!");
    }

    function verifyOverrideCode() {
        const enteredCode =
        document.getElementById('overrideCode').value/trim().toUpperCase();

        if (enteredCode === '1111') {
            alert("MASTER OVERRIDE ACCESS GRATED: STAGE DEACTIVATED.");
            socket.send('GAME_WON');
        }

        else if (enteredCode === 'RECOVERY') {
            alert("SYSTEM RECOVERY: INJECTING 2-MINUTE REVENUE BUFFER.");
            socket.send('ADD_TIME');
        }

        else if (enteredCode === 'SHIELD') {
            alert("DATA DEFENSES LINKED: BLOCKED SYSTEM ATTACKS.")
        }

        else {
            alert("ACCESS DENIED: INVALID DECRYPTION DECOMPRESSION CODE.");
            socket.send('TRIGGER_PENALTY');
        }

        document.getElementById('overrideCode').value = '';
    }
</script>
</html>
